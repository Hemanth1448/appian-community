<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppianHub</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
}

.hero{
    text-align:center;
    padding:100px 20px;
}

.hero h1{
    font-size:50px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.features{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    padding:50px 20px;
}

.card{
    background:#1e293b;
    padding:20px;
    width:250px;
    border-radius:10px;
}

footer{
    text-align:center;
    padding:20px;
    background:#111827;
}
</style>

</head>
<body>

<header>
    <h2>AppianHub</h2>
</header>

<section class="hero">
    <h1>Global Community for Appian Professionals</h1>
    <p>Learn • Connect • Grow • Get Hired</p>

    <a href="#" class="btn">Join Community</a>
</section>

<section class="features">

    <div class="card">
        <h3>Interview Questions</h3>
        <p>500+ Appian interview questions.</p>
    </div>

    <div class="card">
        <h3>Jobs</h3>
        <p>Latest Appian opportunities.</p>
    </div>

    <div class="card">
        <h3>Tutorials</h3>
        <p>Record Types, Integrations and SAIL.</p>
    </div>

</section>

<footer>
    © 2026 AppianHub
</footer>

</body>
</html>
